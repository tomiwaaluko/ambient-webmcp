<body>
  <h1>Acme Booking</h1>
  <p class="role">Widget vendor. Host-assigned label <code>acme</code>, widget id <code>booking</code>.</p>
  <p class="role"><strong>PRO-19 walking skeleton.</strong> One tool: <code>search</code>.</p>
  <pre id="status">booting…</pre>

<script type="module">
import { registerConformantTool } from './vendor/helper.js';

const HOST = 'https://ambient-host-tomiwaalukos-projects.vercel.app';
const statusEl = document.getElementById('status');

try {
  await registerConformantTool({
    widgetId: 'booking',
    name: 'search',
    description: 'Search available bookings.',
    inputSchema: {
      type: 'object',
      properties: {
        query: { type: 'string', description: 'Free-text booking search query.' }
      },
      required: ['query'],
      additionalProperties: false
    },
    readOnly: true,
    untrustedContent: false,
    exposedTo: [HOST],
    execute: async (input) => ({
      content: [{
        type: 'text',
        text: `acme:search received query=${JSON.stringify(input?.query ?? null)}`
      }]
    })
  });
  statusEl.textContent = 'registered search → exposedTo host';
  parent.postMessage({ source: 'ambient-skeleton-widget', type: 'ready' }, '*');
} catch (cause) {
  statusEl.textContent = `registration failed: ${cause?.name ?? 'Error'}: ${cause?.message ?? cause}`;
  parent.postMessage({ source: 'ambient-skeleton-widget', type: 'error', message: String(cause?.message ?? cause) }, '*');
}
</script>
