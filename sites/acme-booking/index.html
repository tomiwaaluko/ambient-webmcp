  :root { color-scheme: light dark; }
  body { font: 14px/1.5 system-ui, sans-serif; margin: 0; padding: 1rem; max-width: 42rem; }

<body>
  <h1>Acme Booking</h1>
  <p class="role">Widget vendor <code>acme</code> · widget id <code>booking</code> · tools <code>search</code>, <code>book</code>.</p>

  <div class="panel">
    <h2>Session authorization</h2>
    <label><input type="checkbox" id="authorize"> Allow mutating <code>book</code> calls this session</label>
  </div>

  <div class="panel">
    <h2>Catalog (synthetic)</h2>
    <ul id="catalog"></ul>
  </div>

  <div class="panel">
    <h2>Reservations</h2>
    <ul id="bookings"><li>None yet.</li></ul>
  </div>

  <pre id="status">booting…</pre>

<script type="module">
import {
  bootWidget,
  getBookings,
  getCatalog,
  setAuthorized
} from './widget.js';

const statusEl = document.getElementById('status');
const catalogEl = document.getElementById('catalog');
const bookingsEl = document.getElementById('bookings');
const authorizeEl = document.getElementById('authorize');

function renderCatalog() {
  catalogEl.innerHTML = getCatalog()
    .map((row) => `<li><code>${row.id}</code> ${row.destination} · ${row.date} · ${row.seats} seat(s)</li>`)
    .join('');
}

function renderBookings() {
  const rows = getBookings();
  bookingsEl.innerHTML = rows.length
    ? rows.map((row) => `<li><code>${row.id}</code> ${row.destination} — ${row.guestName}</li>`).join('')
    : '<li>None yet.</li>';
}

authorizeEl.addEventListener('change', () => {
  setAuthorized(authorizeEl.checked);
  statusEl.textContent = authorizeEl.checked
    ? 'Session authorized for book.'
    : 'Session not authorized for book.';
});

try {
  await bootWidget({
    onStatus(line) {
      statusEl.textContent = line;
      renderBookings();
    }
  });
  renderCatalog();
  renderBookings();
  statusEl.textContent = 'Ready — search (read-only) and book (mutating, requires authorization).';
  parent.postMessage({ source: 'ambient-widget', vendor: 'acme', type: 'ready' }, '*');
} catch (cause) {
  statusEl.textContent = `registration failed: ${cause?.name ?? 'Error'}: ${cause?.message ?? cause}`;
  parent.postMessage({ source: 'ambient-widget', vendor: 'acme', type: 'error', message: String(cause?.message ?? cause) }, '*');
}
</script>
</body>
