<body>
  <h1>Acme Booking</h1>
  <p class="role">Widget vendor. Host-assigned label <code>acme</code>.</p>
  <p class="role"><strong>PRO-5 spike build.</strong> Disposable — PRO-14 replaces it.</p>
  <pre id="status">booting…</pre>

<script type="module">
// ---------------------------------------------------------------------------
// PRO-5 viability spike. Parameterised so the host can flip one leg of the
// three-way AND at a time and watch what the other side sees.
//
// Query parameters
//   exposed=host   registerTool gets exposedTo: [HOST_ORIGIN]     (default)
//   exposed=none   registerTool gets no exposedTo at all
//   exposed=wrong  registerTool gets exposedTo: [a decoy origin]
//   late=<ms>      also register a second tool after <ms>, for the toolchange probe
// ---------------------------------------------------------------------------

const HOST_ORIGIN = 'https://ambient-host-tomiwaalukos-projects.vercel.app';
const DECOY_ORIGIN = 'https://zenith-support-tomiwaalukos-projects.vercel.app';

const params = new URLSearchParams(location.search);
const exposedMode = params.get('exposed') ?? 'host';
const lateMs = params.get('late') ? Number(params.get('late')) : null;

const statusEl = document.getElementById('status');
const log = [];
function note(line) {
  log.push(line);
  statusEl.textContent = log.join('\n');
}

function exposedToFor(mode) {
  if (mode === 'none') return undefined;
  if (mode === 'wrong') return [DECOY_ORIGIN];
  return [HOST_ORIGIN];
}

const diagnostics = {
  origin: location.origin,
  exposedMode,
  hasModelContext: typeof document.modelContext !== 'undefined',
  isFramed: window.top !== window.self,
  registered: [],
  errors: []
};

function buildDescriptor(name, description, extra = {}) {
  const exposedTo = exposedToFor(exposedMode);
  const descriptor = {
    name,
    description,
    inputSchema: {
      type: 'object',
      properties: { query: { type: 'string', description: 'Free-text search over Acme inventory.' } },
      required: ['query']
    },
    annotations: { readOnlyHint: true },
    async execute(input) {
      const query = input && input.query;
      return {
        content: [{ type: 'text', text: `acme:${name} received query=${JSON.stringify(query ?? null)}` }]
      };
    },
    ...extra
  };
  if (exposedTo) descriptor.exposedTo = exposedTo;
  return descriptor;
}

function register(name, description, extra) {
  try {
    document.modelContext.registerTool(buildDescriptor(name, description, extra));
    diagnostics.registered.push(name);
    note(`registered ${name} (exposedTo=${exposedMode})`);
    return true;
  } catch (cause) {
    const text = `${cause && cause.name}: ${cause && cause.message}`;
    diagnostics.errors.push(`${name} -> ${text}`);
    note(`FAILED ${name} -> ${text}`);
    return false;
  }
}

if (!diagnostics.hasModelContext) {
  note('document.modelContext is undefined — WebMCP unavailable on this origin.');
} else {
  register('acme_search', 'Search Acme Booking inventory.');
}

// The toolchange probe (spike Q4): register a *second* tool later, well after
// the host has finished its first aggregation pass, and see whether the
// embedder's document hears about it.
if (lateMs !== null && diagnostics.hasModelContext) {
  setTimeout(() => {
    register('acme_late', 'Registered after first paint, to test embedder toolchange.');
    postToParent('late-registered');
  }, lateMs);
}

function postToParent(type, extra = {}) {
  if (window.top === window.self) return;
  parent.postMessage({ source: 'ambient-spike-widget', type, diagnostics, ...extra }, '*');
}

// Commands the host drives this frame with. Deliberately tiny; the spike needs
// remote control, not a protocol.
window.addEventListener('message', async (event) => {
  const data = event.data;
  if (!data || data.target !== 'ambient-spike-widget') return;

  if (data.cmd === 'register-late') {
    const name = data.name || `acme_late_${Date.now()}`;
    const ok = register(name, 'Late tool registered on host command.');
    postToParent('cmd-result', { cmd: data.cmd, ok, name, replyTo: data.replyTo });
    return;
  }

  if (data.cmd === 'report') {
    // What does the widget itself see? Compared against what the host sees,
    // this separates "not registered" from "registered but not visible".
    let own = null;
    let ownError = null;
    try {
      own = (await document.modelContext.getTools()).map((t) => ({ name: t.name, origin: t.origin }));
    } catch (cause) {
      ownError = `${cause && cause.name}: ${cause && cause.message}`;
    }
    postToParent('cmd-result', { cmd: data.cmd, own, ownError, replyTo: data.replyTo });
  }
});

note(`modelContext=${diagnostics.hasModelContext} framed=${diagnostics.isFramed}`);
postToParent('ready');
</script>
