<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northwind — origin trial delivery probe</title>

<!-- DELIBERATELY NO <meta http-equiv="origin-trial"> HERE.
     This page exists to measure whether an external JS file can turn the trial
     on by creating the meta element at runtime (PRO-5 spike Q6). A static meta
     tag would make the result meaningless. sites/northwind-checkout/index.html
     keeps its static token, so R35 still holds for the origin itself. -->
<script src="./ot-inject.js"></script>

<style>
  :root { color-scheme: light dark; }
  body { font: 14px/1.5 system-ui, sans-serif; margin: 0; padding: 1rem; }
  h1 { font-size: 1.05rem; margin: 0 0 .5rem; }
  pre { background: color-mix(in srgb, currentColor 8%, transparent); padding: .5rem;
        border-radius: 4px; overflow-x: auto; font-size: 12px; }
</style>
</head>
<body>
  <h1>Northwind — origin trial delivery probe</h1>
  <pre id="out">measuring…</pre>

<script type="module">
// The token, if any, was injected by ./ot-inject.js during head parsing.
// By the time this module runs, the trial is either on or it is not.
const inject = window.__otInject ?? { error: 'ot-inject.js did not run' };

const report = {
  ...inject,
  href: location.href,
  origin: location.origin,
  isFramed: window.top !== window.self,
  // The actual measurement.
  modelContextNow: typeof document.modelContext,
  trialActive: typeof document.modelContext !== 'undefined',
  metaTagsInDom: [...document.querySelectorAll('meta[http-equiv="origin-trial"]')].length,
  registerToolWorked: null,
  registerToolError: null
};

// A live capability check beats a typeof: presence of the object without a
// working registerTool would be a different (and worse) result.
if (report.trialActive) {
  try {
    document.modelContext.registerTool({
      name: 'northwind_probe',
      description: 'Proves the trial is not merely present but usable.',
      inputSchema: { type: 'object', properties: {} },
      annotations: { readOnlyHint: true },
      async execute() { return { content: [{ type: 'text', text: 'northwind probe ok' }] }; }
    });
    report.registerToolWorked = (await document.modelContext.getTools()).some(
      (t) => t.name === 'northwind_probe'
    );
  } catch (cause) {
    report.registerToolWorked = false;
    report.registerToolError = `${cause && cause.name}: ${cause && cause.message}`;
  }
}

window.__otReport = report;
document.getElementById('out').textContent = JSON.stringify(report, null, 2);

if (window.top !== window.self) {
  parent.postMessage({ source: 'ambient-spike-otprobe', type: 'report', report }, '*');
}
</script>
</body>
</html>
