<style>
  :root { color-scheme: light dark; }
  body { font: 14px/1.5 system-ui, sans-serif; margin: 0; padding: 1rem; max-width: 42rem; }
  h1 { font-size: 1.25rem; margin: 0 0 .25rem; }

  .panel { border: 1px solid color-mix(in srgb, currentColor 18%, transparent); border-radius: 6px; padding: .75rem; margin: .75rem 0; }

<body>
  <h1>Northwind Checkout</h1>
  <p class="role">Widget vendor <code>northwind</code> · widget id <code>checkout</code> · tools <code>quote</code>, <code>pay</code>.</p>

  <div class="panel">
    <h2>Session authorization</h2>
    <label><input type="checkbox" id="authorize"> Allow mutating <code>pay</code> calls this session</label>
  </div>

  <div class="panel">
    <h2>Catalog (synthetic)</h2>
    <ul id="catalog"></ul>
  </div>

  <div class="panel">
    <h2>Orders</h2>
    <ul id="orders"><li>None yet.</li></ul>
  </div>

  <pre id="status">booting…</pre>

<script type="module">
import {
  bootWidget,
  getCatalog,
  getOrders,
  setAuthorized
} from './widget.js';

const statusEl = document.getElementById('status');
const catalogEl = document.getElementById('catalog');
const ordersEl = document.getElementById('orders');
const authorizeEl = document.getElementById('authorize');

function renderCatalog() {
  catalogEl.innerHTML = getCatalog()
    .map((row) => `<li><code>${row.sku}</code> ${row.name} — $${row.unitPrice}</li>`)
    .join('');
}

function renderOrders() {
  const rows = getOrders();
  ordersEl.innerHTML = rows.length
    ? rows.map((row) => `<li><code>${row.orderId}</code> ${row.sku} × ${row.quantity} — $${row.total}</li>`).join('')
    : '<li>None yet.</li>';
}

authorizeEl.addEventListener('change', () => {
  setAuthorized(authorizeEl.checked);
  statusEl.textContent = authorizeEl.checked
    ? 'Session authorized for pay.'
    : 'Session not authorized for pay.';
});

try {
  await bootWidget({
    onStatus(line) {
      statusEl.textContent = line;
      renderOrders();
    }
  });
  renderCatalog();
  renderOrders();
  statusEl.textContent = 'Ready — quote (read-only) and pay (mutating, requires authorization).';
  parent.postMessage({ source: 'ambient-widget', vendor: 'northwind', type: 'ready' }, '*');
} catch (cause) {
  statusEl.textContent = `registration failed: ${cause?.name ?? 'Error'}: ${cause?.message ?? cause}`;
  parent.postMessage({ source: 'ambient-widget', vendor: 'northwind', type: 'error', message: String(cause?.message ?? cause) }, '*');
}
</script>
</body>
