  :root { color-scheme: light dark; }
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 60rem; margin: 2rem auto; padding: 0 1.5rem; }
  code { font-family: ui-monospace, monospace; }
  .role { color: color-mix(in srgb, currentColor 60%, transparent); }

<body>
  <h1>Ambient — host</h1>
  <p class="role">Host aggregator (PRO-8). Gate 2 console path preserved.</p>

  <h2>Embedded widget</h2>
  <div id="frames"></div>

  <h2>Inspector</h2>
  <div id="inspector" aria-live="polite"></div>

  <h2>Agent console</h2>
  <p class="role">Call the namespaced proxy via <code>window.ambient.call('acme.booking.search', { query: '…' })</code>.</p>
  <button type="button" id="demo-call">Demo: acme.booking.search</button>
  <pre id="log">booting…</pre>

<script type="module">
import { startAggregator, ALLOWLIST } from './host/aggregator.js';
import { renderInspector } from './host/inspector.js';
import { executeToolCompat } from './vendor/adapter.js';

const ACME = 'https://acme-booking-tomiwaalukos-projects.vercel.app';
const framesEl = document.getElementById('frames');
const inspectorEl = document.getElementById('inspector');
const logEl = document.getElementById('log');
const lines = [];

function log(...parts) {
  const line = parts.map((p) => (typeof p === 'string' ? p : JSON.stringify(p, null, 2))).join(' ');
  lines.push(line);
  logEl.textContent = lines.slice(-20).join('\n');
}

function mountAcme() {
  const frame = document.createElement('iframe');
  frame.allow = `tools ${ACME}`;
  frame.src = `${ACME}/`;
  frame.title = 'Acme Booking widget';
  framesEl.appendChild(frame);
  return frame;
}

async function listHostTools() {
  const tools = await document.modelContext.getTools();
  return tools.map((t) => ({ name: t.name, origin: t.origin }));
}

async function callProxy(name, input) {
  const tools = await document.modelContext.getTools();
  const tool = tools.find((t) => t.name === name);
  if (!tool) {
    return { ok: false, code: 'PROXY_NOT_FOUND', message: `No tool named ${name} on the host surface.` };
  }
  return executeToolCompat(tool, input);
}

window.ambient = {
  ALLOWLIST,
  call: callProxy,
  listTools: listHostTools
};

const frame = mountAcme();

window.addEventListener('message', (event) => {
  if (event.source !== frame.contentWindow) return;
  const data = event.data;
  if (!data || data.source !== 'ambient-skeleton-widget') return;
  log(`widget ${data.type}${data.message ? `: ${data.message}` : ''}`);
});

startAggregator((snapshot) => {
  renderInspector(inspectorEl, snapshot.origins);
  log(`aggregated gen=${snapshot.generation}`, snapshot.origins, snapshot.errors);
});

document.getElementById('demo-call').addEventListener('click', async () => {
  const outcome = await callProxy('acme.booking.search', { query: 'flights to lisbon' });
  log('demo call', outcome);
});

log('host ready', { modelContext: typeof document.modelContext });
</script>
</body>
