<body>
  <h1>Ambient — host</h1>
  <p class="role">Host site. Aggregates tools from allowlisted widget origins.</p>
  <p class="role"><strong>PRO-5 viability spike console.</strong> Disposable — PRO-15 builds the real demo page here.
     Drive it from DevTools via <code>window.spike</code>; results also land in <code>window.__spike</code>.</p>

  <div id="frames"></div>
  <pre id="log">idle</pre>

<script type="module">
import { executeToolCompat, getInputShape, resetInputShape } from './vendor/adapter.js';

// ---------------------------------------------------------------------------
// PRO-5 viability spike console.
//
// WebMCP federation needs a three-way AND, and missing any leg yields an empty
// list with no error. This console exists to flip one leg at a time and record
// exactly what the host sees.
//
//   leg 1  host iframe carries allow="tools <widget-origin>"
//   leg 2  widget registers with exposedTo: ['<host-origin>']
//   leg 3  host calls getTools({ fromOrigins: ['<widget-origin>'] })
// ---------------------------------------------------------------------------

const ORIGINS = {
  host: 'https://ambient-host-tomiwaalukos-projects.vercel.app',
  acme: 'https://acme-booking-tomiwaalukos-projects.vercel.app',
  northwind: 'https://northwind-checkout-tomiwaalukos-projects.vercel.app',
  zenith: 'https://zenith-support-tomiwaalukos-projects.vercel.app'
};

const framesEl = document.getElementById('frames');
const logEl = document.getElementById('log');
const lines = [];
function log(...parts) {
  const line = parts.map((p) => (typeof p === 'string' ? p : JSON.stringify(p))).join(' ');
  lines.push(line);
  logEl.textContent = lines.slice(-40).join('\n');
  return line;
}

/** Everything the driver reads back out. */
const results = {
  toolchangeEvents: [],
  widgetMessages: []
};
window.__spike = results;

// --- toolchange instrumentation (spike Q4) ---------------------------------
// Both listener styles, because a spec may fire on one and not the other.
let toolchangeCount = 0;
function recordToolchange(via, event) {
  toolchangeCount += 1;
  results.toolchangeEvents.push({
    via,
    n: toolchangeCount,
    at: Date.now(),
    type: event && event.type,
    ctor: event && event.constructor && event.constructor.name
  });
  log(`toolchange fired via ${via} (#${toolchangeCount})`);
}
document.modelContext?.addEventListener?.('toolchange', (e) => recordToolchange('addEventListener', e));
if (document.modelContext) {
  document.modelContext.ontoolchange = (e) => recordToolchange('ontoolchange', e);
}

window.addEventListener('message', (event) => {
  const data = event.data;
  if (!data || data.source !== 'ambient-spike-widget') return;
  results.widgetMessages.push({ at: Date.now(), origin: event.origin, ...data });
  log(`widget message: ${data.type} from ${event.origin}`);
});

// --- frame mounting ---------------------------------------------------------

/**
 * Mount a widget iframe.
 * @param {object} opts
 * @param {'acme'|'northwind'|'zenith'} [opts.site]
 * @param {string} [opts.src]              explicit src, overrides site
 * @param {'grant'|'bare'|'omit'|'wrong'} [opts.allow]  leg 1
 * @param {'host'|'none'|'wrong'} [opts.exposed] leg 2, forwarded to the widget
 * @param {number|null} [opts.late]
 * @returns {Promise<{ frame: HTMLIFrameElement, origin: string, ready: object|null }>}
 */
async function mount({ site = 'acme', src = null, allow = 'grant', exposed = 'host', late = null } = {}) {
  const origin = src ? new URL(src, location.href).origin : ORIGINS[site];
  const url = new URL(src ?? `${origin}/`);
  if (!src) {
    url.searchParams.set('exposed', exposed);
    if (late !== null) url.searchParams.set('late', String(late));
  }

  const frame = document.createElement('iframe');

  // Order matters for a dynamically-created frame: the container policy must be
  // set before src, or the frame's document loads without the grant.
  if (allow === 'grant') frame.allow = `tools ${origin}`;
  else if (allow === 'bare') frame.allow = 'tools'; // the spec's own example form
  else if (allow === 'wrong') frame.allow = `tools ${ORIGINS.zenith}`;
  // allow === 'omit' -> attribute never set; `tools` then defaults to 'self',
  // which excludes a cross-origin child.

  frame.src = url.href;
  frame.dataset.origin = origin;
  framesEl.appendChild(frame);

  const ready = await new Promise((resolve) => {
    const timer = setTimeout(() => resolve(null), 8000);
    function onMessage(event) {
      if (event.source !== frame.contentWindow) return;
      const data = event.data;
      if (!data || data.source !== 'ambient-spike-widget' || data.type !== 'ready') return;
      clearTimeout(timer);
      window.removeEventListener('message', onMessage);
      resolve(data.diagnostics ?? null);
    }
    window.addEventListener('message', onMessage);
  });

  log(`mounted ${url.href} allow=${allow} (${frame.allow || 'attribute absent'})`);
  return { frame, origin, ready, allowAttr: frame.allow || null };
}

/** Ask a mounted frame something and wait for its reply. */
function ask(frame, cmd, extra = {}) {
  const replyTo = `r${Math.random().toString(36).slice(2)}`;
  return new Promise((resolve) => {
    const timer = setTimeout(() => resolve({ timedOut: true }), 5000);
    function onMessage(event) {
      const data = event.data;
      if (!data || data.source !== 'ambient-spike-widget') return;
      if (data.type !== 'cmd-result' || data.replyTo !== replyTo) return;
      clearTimeout(timer);
      window.removeEventListener('message', onMessage);
      resolve(data);
    }
    window.addEventListener('message', onMessage);
    frame.contentWindow.postMessage({ target: 'ambient-spike-widget', cmd, replyTo, ...extra }, '*');
  });
}

/** Snapshot of a getTools call, flattened for logging. */
async function snapshot(arg) {
  try {
    const tools = arg === undefined
      ? await document.modelContext.getTools()
      : await document.modelContext.getTools(arg);
    return {
      ok: true,
      count: tools.length,
      tools: tools.map((t) => ({
        name: t.name,
        origin: t.origin,
        description: t.description,
        readOnlyHint: t.annotations && t.annotations.readOnlyHint,
        untrustedContentHint: t.annotations && t.annotations.untrustedContentHint,
        inputSchemaType: typeof t.inputSchema,
        sameWindowAsHost: t.window === window
      }))
    };
  } catch (cause) {
    return { ok: false, error: `${cause && cause.name}: ${cause && cause.message}` };
  }
}

function reset() {
  framesEl.textContent = '';
  results.toolchangeEvents.length = 0;
  results.widgetMessages.length = 0;
  toolchangeCount = 0;
  lines.length = 0;
  logEl.textContent = 'reset';
}

/**
 * Register a host-owned tool, so Q5 can compare host tools against widget
 * tools. registerTool returns a promise; awaiting it is what keeps a failed
 * registration from disappearing.
 */
async function registerHostTool(name = 'host_marker') {
  await document.modelContext.registerTool({
    name,
    description: 'Host-owned marker tool. Present so the spike can tell host tools from widget tools.',
    inputSchema: { type: 'object', properties: {} },
    annotations: { readOnlyHint: true },
    async execute() {
      return { content: [{ type: 'text', text: 'host marker ok' }] };
    }
  });
  return name;
}

window.spike = {
  ORIGINS, mount, ask, snapshot, reset, registerHostTool,
  executeToolCompat, getInputShape, resetInputShape,
  results,
  get toolchangeCount() { return toolchangeCount; }
};

log('spike console ready. modelContext=' + (typeof document.modelContext));
log('adapter loaded from ./vendor/adapter.js');
</script>
</body>
